<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Suivi de mensurations fitness : poids, poitrine, bras, cuisses… Stocké localement, 100% hors ligne.">
  <meta name="theme-color" content="#070b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTracker">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <title>FitTracker</title>
  <script defer src="vendor/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="header">
    <div class="header-top">
      <div class="logo" aria-hidden="true">FT</div>
      <div>
        <h1>FitTracker</h1>
        <div class="subtitle" id="subtitle">0 entrée · stockage local</div>
      </div>
    </div>
    <div class="tabs" id="top-tabs">
      <button class="tab-btn active" onclick="switchTab(0)">📋 Saisir</button>
      <button class="tab-btn" onclick="switchTab(1)">📊 Graphiques</button>
      <button class="tab-btn" onclick="switchTab(2)">🎯 Objectifs</button>
      <button class="tab-btn" onclick="switchTab(3)">📅 Historique</button>
    </div>
  </div>

  <div class="main">

    <!-- TAB 0: SAISIR -->
    <div class="panel active" id="panel-0">
      <div class="form-row">
        <div class="form-group" style="flex:1;min-width:130px">
          <label>Date</label>
          <input type="date" id="input-date">
        </div>
        <div class="form-group" style="flex:2;min-width:180px">
          <label>Note (optionnel)</label>
          <input type="text" id="input-note" placeholder="Ex: Prise de masse semaine 3…">
        </div>
      </div>
      <div id="grid-saisir"></div>
      <button class="btn-primary" id="btn-save" onclick="saveEntry()">💾 Enregistrer cette entrée</button>
    </div>

    <!-- TAB 1: GRAPHIQUES -->
    <div class="panel" id="panel-1">
      <div class="chips" id="chips-metrics"></div>
      <div class="pills" id="stat-pills"></div>
      <div class="chart-box" id="chart-box">
        <div class="chart-title" id="chart-title"></div>
        <div class="chart-wrap"><canvas id="myChart"></canvas></div>
      </div>
      <div class="empty" id="chart-empty" style="display:none">
        <div class="empty-icon">📈</div>
        <p id="chart-empty-msg">Aucune donnée pour cette métrique</p>
      </div>
    </div>

    <!-- TAB 2: OBJECTIFS -->
    <div class="panel" id="panel-2">
      <p class="hint">
        Définis tes objectifs — ils apparaîtront dans les graphiques pour visualiser ta progression.
      </p>
      <div id="grid-goals"></div>
      <button class="btn-goal" id="btn-save-goals" onclick="saveGoals()">🎯 Sauvegarder les objectifs</button>

      <div class="export-box">
        <div class="export-title">📤 Export / Import</div>
        <div class="export-btns">
          <button class="btn-sm btn-export" onclick="exportJSON()">⬇️ Exporter JSON</button>
          <label class="btn-sm btn-import file-label" style="padding:8px 14px;cursor:pointer">
            ⬆️ Importer JSON
            <input type="file" accept=".json" onchange="importJSON(event)">
          </label>
          <button class="btn-sm btn-csv" onclick="exportCSV()">📊 Exporter CSV</button>
        </div>
      </div>
    </div>

    <!-- TAB 3: HISTORIQUE -->
    <div class="panel" id="panel-3">
      <div id="history-list"></div>
    </div>
  </div>

  <nav class="tabbar" aria-label="Navigation principale">
    <button class="tab-btn active" onclick="switchTab(0)"><span class="tbi">📋</span><span class="tbl">Saisir</span></button>
    <button class="tab-btn" onclick="switchTab(1)"><span class="tbi">📊</span><span class="tbl">Graphiques</span></button>
    <button class="tab-btn" onclick="switchTab(2)"><span class="tbi">🎯</span><span class="tbl">Objectifs</span></button>
    <button class="tab-btn" onclick="switchTab(3)"><span class="tbi">📅</span><span class="tbl">Historique</span></button>
  </nav>

  <script src="assets/js/app.js"></script>
</body>

</html>
